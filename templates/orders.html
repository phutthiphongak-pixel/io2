{% extends 'base.html' %}{% block content %}<header class="pagehead"><div><p class="eyebrow">รายการขาย</p><h1>ออเดอร์ทั้งหมด</h1></div><a class="button primary" href="/pos">＋ รับออเดอร์</a></header><section class="panel tablewrap"><table><thead><tr><th>เลขที่</th><th>โต๊ะ</th><th>เวลา</th><th>สถานะ</th><th></th></tr></thead><tbody>{% for o in orders %}<tr><td>#{{ o.id }}</td><td>{{ o.label or 'สั่งกลับบ้าน' }}</td><td>{{ o.created_at }}</td><td><span class="status blue">{{ o.status }}</span></td><td><a href="/orders/{{ o.id }}">รายละเอียด →</a></td></tr>{% else %}<tr><td colspan="5">ยังไม่มีออเดอร์</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
